[package]
name = "tlsn-bench-pcs"
version = "0.1.0"
edition = "2021"
description = "External commitments for the Artemis/TLSNotary benchmark: Pedersen vector commitment with a zero-knowledge IPA opening, and hiding KZG, both over BN254."

[dependencies]
ark-bn254 = { version = "0.6.0" }
ark-ec = { version = "0.6", features = ["parallel"] }
ark-ff = { version = "0.6", features = ["asm", "std", "parallel"] }
ark-serialize = "0.6"
ark-std = { version = "0.6", features = ["std"] }
rand = "0.8"
rayon = "1.10"
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1"
