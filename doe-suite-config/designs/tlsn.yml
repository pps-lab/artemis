# TLSNotary benchmark (tlsn-bench/, see its README.md) on AWS: the same points as the local run
# (tlsn-bench/results/results.csv, Apple M5 Pro).
#
# One job = one bench.py invocation for one (workload, backend, payload size); it writes results/results.csv in
# the bench.py format (one row per repetition), which super_etl/combined_plots.yml reads with TlsnCsvExtractor.
# `note` records the instance type in every CSV row.
#
#   exp_provekit, exp_bb  r6i.8xlarge  (host type tlsn_small)  all rows the local run has, same size caps
#
# Rows per size, as in tlsn-bench/run.sh: every row of the backend (`rows: ""`; Keccak-256 without black box
# capped at 16 KiB by bench.py's LOCAL_CAP, BLAKE3 black box at 1 KiB).
$SUITE_VARS$:
  runs: 5
  out: results.csv
  rows: ""
  cmd: >-
    python3 [% 'exp_code_dir' | at_runtime(exp_host_lst) %]/tlsn-bench/bench.py [% my_run.workload %]
    --sizes [% my_run.size %] --backends [% my_run.backend %] --rows '[% my_run.rows %]'
    --runs [% my_run.runs %] --out results/[% my_run.out %] --note '[% my_run.note %]' --clean-build

exp_provekit:
  n_repetitions: 1
  host_types:
    tlsn_small:
      n: 1
      init_roles: setup-tlsn
      $CMD$: "[% my_run.cmd %]"
  base_experiment:
    backend: provekit
    note: "aws r6i.8xlarge"
    workload: $FACTOR$
    size: $FACTOR$
    rows: $FACTOR$
  factor_levels:
    - {workload: age, size: 10, rows: ""}
    - {workload: sweep, size: 520, rows: ""}
    - {workload: sweep, size: 2400, rows: ""}
    - {workload: sweep, size: 4000, rows: ""}
    - {workload: sweep, size: 10000, rows: ""}
    - {workload: sweep, size: 16384, rows: ""}
    - {workload: sweep, size: 65536, rows: ""}

exp_bb:
  n_repetitions: 1
  host_types:
    tlsn_small:
      n: 1
      init_roles: setup-tlsn
      $CMD$: "[% my_run.cmd %]"
  base_experiment:
    backend: bb
    note: "aws r6i.8xlarge"
    workload: $FACTOR$
    size: $FACTOR$
    rows: $FACTOR$
  factor_levels:
    - {workload: age, size: 10, rows: ""}
    - {workload: sweep, size: 520, rows: ""}          # "" = every bb row + the external openings
    - {workload: sweep, size: 2400, rows: ""}
    - {workload: sweep, size: 4000, rows: ""}
    - {workload: sweep, size: 10000, rows: ""}
    - {workload: sweep, size: 16384, rows: ""}
    - {workload: sweep, size: 65536, rows: ""}

$ETL$:
  overview:
    experiments: "*"
    extractors:
      CsvExtractor: {file_regex: ["^results\\.csv$"]}
      IgnoreExtractor: {file_regex: ["^stdout\\.log$", "^stderr\\.log$"]}
    transformers: []
    loaders:
      CsvSummaryLoader: {skip_empty: True}
