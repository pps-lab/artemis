# LegoSNARK CP_link cost estimate on Barretenberg for the TLSNotary benchmark (tlsn-bench/README.md,
# "LegoSNARK CP_link on Barretenberg"). Separate from designs/tlsn.yml: it needs Barretenberg built from
# source with tlsn-bench/barretenberg-dump.patch (roles/setup-tlsn-lego).
#
# One job = one bench.py invocation for one payload size. Each job measures the no-commitment circuit and the
# Artemis estimate (+ its external KZG opening) next to the two LegoSNARK rows, so the overheads are
# same-machine, same-session differences.
$SUITE_VARS$:
  runs: 5
  cmd: >-
    python3 [% 'exp_code_dir' | at_runtime(exp_host_lst) %]/tlsn-bench/bench.py sweep
    --sizes [% my_run.size %] --backends bb
    --rows nocom,artemis_estimate,external,lego_estimate,lego_packed_estimate
    --runs [% my_run.runs %] --out results/results.csv --note '[% my_run.note %]' --clean-build

exp_lego:
  n_repetitions: 1
  host_types:
    tlsn_lego:
      n: 1
      init_roles: setup-tlsn-lego
      $CMD$: "[% my_run.cmd %]"
  base_experiment:
    note: "aws r6i.8xlarge"
    size:
      $FACTOR$: [520, 2400, 4000, 10000, 16384, 65536]

$ETL$:
  overview:
    experiments: "*"
    extractors:
      CsvExtractor: {file_regex: ["^results\\.csv$"]}
      IgnoreExtractor: {file_regex: ["^stdout\\.log$", "^stderr\\.log$", "^lego_layout\\.json$"]}
    transformers: []
    loaders:
      CsvSummaryLoader: {skip_empty: True}
