# LegoSNARK CP_link (Kiltz-Wee QA-NIZK) baseline, KZG only. Same circuit layout as Apollo (cp_link+).
$SUITE_VARS$:
  $INCLUDE_VARS$: general.yml

exp_lego_kzg_mobilenet:
  n_repetitions: 1
  host_types: {medium: {n: 1, init_roles: setup-base, $CMD$: "[% my_run.cmd %]"}}
  base_experiment:
    model: mobilenet
    cpsnark: cp_link_lego
    pc_type: kzg

exp_lego_kzg_vgg:
  n_repetitions: 1
  host_types: {large: {n: 1, init_roles: setup-base, $CMD$: "[% my_run.cmd %]"}}
  base_experiment:
    model: vgg
    cpsnark: cp_link_lego
    pc_type: kzg


$ETL$:
  overview:
    experiments: "*"
    extractors:
      ErrorExpectedFileExtractor: {expected_file: ["output.csv"]}
      IgnoreExtractor: {file_regex: ["stdout.log"]}
      CsvExtractor: {file_regex: ["output.csv"]}
    transformers: []
    loaders:
      CsvSummaryLoader: {skip_empty: True}
