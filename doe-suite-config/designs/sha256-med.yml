# SHA-256 weight commitment (cpsnark sha256): the Poseidon circuit (_p models) with the commitment hash
# replaced by SHA-256 (halo2_gadgets Table16 + feed-forward, src/commitments/sha256_commit.rs).
# Same machine sizes as the other schemes (r6i.8xlarge small, r6i.16xlarge mobilenet, r6i.32xlarge vgg and
# diffusion). ~2,100 Halo2 rows per 16 weights: measured peak RSS mnist 13 GB, resnet18 141 GB; dlrm and
# larger are expected to exceed the machine's memory (a crash is an accepted result).
$SUITE_VARS$:
  $INCLUDE_VARS$: general.yml

exp_sha256_kzg_mobilenet:
  n_repetitions: 1
  host_types: {medium: {n: 1, init_roles: setup-base, $CMD$: "[% my_run.cmd %]"}}
  base_experiment:
    model: mobilenet
    cpsnark: sha256
    pc_type: kzg

exp_sha256_kzg_vgg:
  n_repetitions: 1
  host_types: {large: {n: 1, init_roles: setup-base, $CMD$: "[% my_run.cmd %]"}}
  base_experiment:
    model: vgg
    cpsnark: sha256
    pc_type: kzg


$ETL$:
  overview:
    experiments: "*"
    extractors:
      ErrorExpectedFileExtractor: {expected_file: ["output.csv"]}
      IgnoreExtractor: {file_regex: ["stdout.log", "runtime_info.yaml"]}
      CsvExtractor: {file_regex: ["output.csv"]}
    transformers: []
    loaders:
      CsvSummaryLoader: {skip_empty: True}
