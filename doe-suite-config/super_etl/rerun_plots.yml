---
# Nov 2026 rerun of the small + medium models (all 7 models; large tier poly/poly-ipa/lego/cplink_fast/poseidon-diffusion + no_com rerun 17 Nov), incl. LegoSNARK.
$SUITE_ID$:
  nocom-small: "1794647780"
  nocom-small-ipa: "1794647819"
  poly-small: "1794647858"
  poly-small-ipa: "1794647898"
  poly-ip-small: "1794647938"
  poly-ip-small_ipa: "1794647978"
  apollo-small: "1794648018"
  cplink-small: "1794648059"
  cplink_fast-small: "1794648099"
  poseidon-small: "1794648139"
  poseidon-small_ipa: "1794648178"
  lego-small: "1794648218"
  nocom-med: "1794655517"
  nocom-med-ipa: "1794653205"
  poly-med: "1794653595"
  poly-med-ipa: "1794652844"
  poly-ip-med: "1794655428"
  poly-ip-med_ipa: "1794652754"
  apollo-med: "1794650747"
  cplink-med: "1794650587"
  cplink_fast-med: "1794650707"
  poseidon-med: "1794650627"
  poseidon-med_ipa: "1794650667"
  lego-med: "1794650787"
  nocom-large: "1794942375"
  nocom-large-ipa: "1794942415"
  poly-large: "1794665782"
  poly-large-ipa: "1794665823"
  lego-large: "1794665863"
  cplink_fast-large: "1794665663"
  xlarge-poseidon_kzg: "1794665702"
  xlarge-poseidon_ipa: "1794665743"
$ETL$:
  grid:
    experiments:
      nocom-small: "*"
      nocom-small-ipa: "*"
      poly-small: "*"
      poly-small-ipa: "*"
      poly-ip-small: "*"
      poly-ip-small_ipa: "*"
      apollo-small: "*"
      cplink-small: "*"
      cplink_fast-small: "*"
      poseidon-small: "*"
      poseidon-small_ipa: "*"
      lego-small: "*"
      nocom-med: "*"
      nocom-med-ipa: "*"
      poly-med: "*"
      poly-med-ipa: "*"
      poly-ip-med: "*"
      poly-ip-med_ipa: "*"
      apollo-med: "*"
      cplink-med: "*"
      cplink_fast-med: "*"
      poseidon-med: "*"
      poseidon-med_ipa: "*"
      lego-med: "*"
      nocom-large: "*"
      nocom-large-ipa: "*"
      poly-large: "*"
      poly-large-ipa: "*"
      lego-large: "*"
      cplink_fast-large: "*"
      xlarge-poseidon_kzg: "*"
      xlarge-poseidon_ipa: "*"
    extractors:
      CsvExtractor: {file_regex: ["output.csv"]} # with default file_regex
      IgnoreExtractor: {file_regex: ["stdout.log", "stderr.log", "runtime_info.yaml"]}

    transformers:
      - name: ConditionalTransformer  # Poseidon on diffusion runs on BLS12-381 (pc_type kzg_bls), plotted in the KZG row
        col: pc_type
        dest: pc_type
        value: {kzg_bls: kzg}
      - name: MergeRowsTransformer
      - name: OsirisPreprocessTransformer
      #- name: ResultFilterTransformer
    loaders:
      CsvSummaryLoader: {skip_empty: True}
      OsirisFactorLoader: {}
      LargeTableLoader: {}
      MyCustomColumnCrossPlotLoader:
        data_filter:
          allowed:
            model: [mnist, resnet18, dlrm, mobilenet, vgg, diffusion, gpt2]
            cpsnark: [no_com, poly, pedersen, cp_link+, cp_link_fast, cp_link, poseidon, cp_link_lego]
            pc_type: [kzg, ipa]

        fig_foreach:
          cols: [$metrics$]
          # jp_except...

        # define metrics (select the data columns)
        metrics:
          prover_time:
            value_cols: [prover_time_sec]
            value_divider: 60.0
            unit_label: min

          verifier_time:
            value_cols: [mean(verifier_time_sec)]
            error_cols: [stddev(verifier_time_sec)]
            value_divider: 1.0
            unit_label: sec

          proof_size:
            value_cols: [proof_size_bytes]
            value_divider: 1000.0
            unit_label: kB

          prover_time_abs:
            value_cols: [prover_time_sec_abs_factor_vs_nocom]
            value_divider: 60.0
            unit_label: min

        ########## Configure each plot:
        cum_plot_config:
        - legend_fig: {label: {template: "{cpsnark}"}, kwargs: {loc: "lower left", ncol: 8, bbox_to_anchor: [0.03, -0.12], columnspacing: 3.5,  fancybox: True}}
        - jp_query: ("$metrics$" != 'verifier_time')
          subplot_grid:
            rows: [pc_type]
            cols: [model]
            share_y: col
            share_x: all
            kwargs:
              constrained_layout: True

        - jp_query: ("$metrics$" == 'verifier_time')
          subplot_grid:
            rows: [pc_type]
            cols: [model]
            share_y: none
            share_x: all
            kwargs:
              constrained_layout: True

        ########## Configure each Subplot:
        cum_subplot_config:
        - jp_query: (subplot_col_idx == `0`)
          yaxis:
            label: {template: "{pc_type} {$metrics$} [{$metric_unit$}]"}
            major_formatter: round_short
        - jp_query: (subplot_row_idx == `0`)
          ax_title: {template: "{model}"}

        - xaxis:
            tick_params:
            - {axis: x, which: both, labelsize: 8}
            - {axis: x, which: major, pad: 10}
        - jp_query: (starts_with("$metrics$", 'prover_time_abs'))
          chart:
            bar_foreach:
              cols: [cpsnark]
              label: {template: ""}
              jp_except: "(cpsnark == 'no_com') || (cpsnark == 'poseidon') || (cpsnark == 'cp_link') || (cpsnark == 'cp_link_fast')" #|| (cpsnark == 'cp_link+')"
        - jp_query: (!starts_with("$metrics$", 'prover_time_abs'))
          chart:
            bar_foreach:
              cols: [cpsnark]
              label: {template: ""}
              #jp_except: ""
          ###### Configure each element (artist) in subfigure (ax)
        - cum_artist_config:
          # colors from: https://davidmathlogic.com/colorblind/#%23000000-%23E69F00-%2356B4E9-%23009E73-%23F0E442-%230072B2-%23D55E00-%23CC79A7
          - color: "#D8D7D2" # "#000000"
            jp_query: starts_with(cpsnark, 'no_com')
          - color: "#E69F00" # orange for LegoSNARK CP_link
            jp_query: starts_with(cpsnark, 'cp_link_lego')
          - color: "#C5DA3F" #"#D55E00"
            jp_query: starts_with(cpsnark, 'cp_link_fast')
          - color: "#009E73" #"#D55E00"
            jp_query: starts_with(cpsnark, 'cp_link+')
          - color: "#99d8c7" # "#F0E442" #E69F00" # "#E69F00"
            jp_query: starts_with(cpsnark, 'cp_link')
          - color: "#0072B2" # "#009E73"
            jp_query: starts_with(cpsnark, 'poly')
          - color: "#D55E00" # "#56B4E9" #
            jp_query: starts_with(cpsnark, 'poseidon')
          - color: "#3FA2DA" # "#56B4E9" #
            jp_query: starts_with(cpsnark, 'pedersen')
          - color: "#CC79A7" # purple/pink for zkfft
            jp_query: starts_with(cpsnark, 'zkfft')
          - edgecolor: black
            linewidth: 2
            zorder: 10000
            jp_query: starts_with(cpsnark, 'cplink+') || starts_with(cpsnark, 'poly')
          label_map:
            no_com: No Commitment
            cp_link: Lunar
            cp_link+: Apollo
            poly: Artemis (Horner)
            poseidon: Poseidon
            pedersen: Artemis (Inner Product)
            cp_link_fast: Lunar (Multi-column)
            cp_link_lego: LegoSNARK
            zkfft: zkFFT

            mnist: MNIST ~8k
            snet: SNET ~100k
            resnet18: ResNet-18 ~280k
            dlrm: DLRM ~764k
            mobilenet: MobileNet ~3.5m
            vgg: VGG-16 ~15m
            gpt2: GPT-2 ~81m
            diffusion: Diffusion ~19.5m

            kzg: KZG
            ipa: IPA

            prover_time: Prover
            verifier_time: Verifier

            proof_size: Proof Size
            prover_time_abs: Proving time difference


